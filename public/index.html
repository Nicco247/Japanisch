<style>
/* Layout: fixed app shell (header, scrolling stage, pinned action bar) so nothing jumps; washi paper, torii vermilion for actions, sakura for progress */
:root{
  --paper:#F7F0EC; --card:#FFFAF7; --ink:#2A2226; --muted:#7B6A6F; --line:#E8D8D6;
  --sakura:#F4C3CF; --sakura-deep:#C95D7E; --torii:#B93A27; --torii-ink:#FFF6F1;
  --ok:#3E7D57; --ok-bg:#E3F1E7; --mid:#9A6A12; --bad:#B93A27; --bad-bg:#F8E1DC;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#18141C; --card:#221C27; --ink:#F2E8EA; --muted:#A9989E; --line:#382E3A;
  --sakura:#5C3446; --sakura-deep:#F19BB5; --torii:#E2664C; --torii-ink:#1B0E0A;
  --ok:#7CC897; --ok-bg:#1F3328; --mid:#E5B65C; --bad:#F08A73; --bad-bg:#3A221E; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#18141C; --card:#221C27; --ink:#F2E8EA; --muted:#A9989E; --line:#382E3A;
  --sakura:#5C3446; --sakura-deep:#F19BB5; --torii:#E2664C; --torii-ink:#1B0E0A;
  --ok:#7CC897; --ok-bg:#1F3328; --mid:#E5B65C; --bad:#F08A73; --bad-bg:#3A221E; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;overflow:hidden;
  touch-action:manipulation;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#petals{position:fixed;inset:0;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;height:100%;height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-gutter:stable;overscroll-behavior:contain;padding-block:20px 32px;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display)}
.jp{font-family:var(--body);font-weight:500}
h1{font-size:1.7rem;margin:0;line-height:1.25;text-wrap:balance}
h2{font-size:1.15rem;margin:0}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.brand{display:flex;align-items:center;gap:10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hero{border-top:4px solid var(--torii)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.center{justify-content:center}
.grow{flex:1;min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sakura-deep);outline-offset:2px}
.btn{border:0;border-radius:999px;padding:12px 20px;background:var(--torii);color:var(--torii-ink);font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.lesson{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.lesson:first-of-type{border-top:0}
.seal{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-size:1.3rem;background:var(--sakura);color:var(--ink)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--sakura-deep);border-radius:6px;transition:width .3s}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toggle input{width:20px;height:20px;accent-color:var(--torii)}
.hint{font-size:.85rem;color:var(--muted)}
.field{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:11px 16px;background:var(--paper);color:var(--ink);font:inherit;text-transform:lowercase;letter-spacing:.1em}
.code{font-size:1.4rem;letter-spacing:.15em;font-variant-numeric:tabular-nums}
/* session shell */
.top{flex:none;display:flex;align-items:center;gap:12px;padding-block:14px 12px}
.x{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;width:40px;height:40px;font-size:1.2rem;line-height:1}
.stage{flex:1;min-height:0;overflow-y:auto;scrollbar-gutter:stable;overscroll-behavior:contain;background:var(--card);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column}
.inner{margin:auto 0;width:100%;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.actions{flex:none;height:80px;display:flex;align-items:center;gap:10px}
.actions .btn{flex:1}
.actions .hint{flex:1;text-align:center}
.big{font-size:2.5rem;line-height:1.25;margin:0;overflow-wrap:anywhere}
.kana{font-size:5rem;line-height:1;margin:0}
.ro{color:var(--muted)}
.de{font-size:1.15rem}
.kanji{font-size:1.3rem;color:var(--sakura-deep)}
.listen{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-size:.9rem}
.listen svg{flex:none}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.opt{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 10px;font-size:1rem;min-height:58px}
.opt.jp{font-size:1.3rem}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.sentblock{width:100%;display:flex;flex-direction:column;align-items:center;gap:4px}
.sent{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 2px}
.tok{border:0;background:transparent;border-bottom:2px dotted var(--sakura-deep);padding:2px 3px;font-family:var(--body);font-weight:500;font-size:1.6rem;line-height:1.3;display:inline-flex;flex-direction:column;align-items:center}
.tok small{font-family:var(--body);font-size:.68rem;color:var(--muted)}
.punct{font-family:var(--body);font-size:1.6rem;padding:2px 0}
.gloss{min-height:1.5em;font-size:.92rem;color:var(--sakura-deep);font-weight:500}
.box{width:100%;background:var(--paper);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;align-items:center}
.box .tok,.box .punct{font-size:1.25rem}
.note{width:100%;margin:0;font-size:.92rem;background:var(--paper);border-left:3px solid var(--sakura-deep);padding:10px 12px;text-align:left;border-radius:0 10px 10px 0}
.fb{font-weight:700;min-height:1.5em}
.ok-t{color:var(--ok)} .mid-t{color:var(--mid)} .bad-t{color:var(--bad)}
.heard{font-size:.9rem;min-height:1.4em}
@media (max-width:380px){.opts{grid-template-columns:1fr}.big{font-size:2.1rem}}
@media (prefers-reduced-motion: reduce){.bar>i{transition:none}}
</style>

  sents:[

   {t:'わたしも|watashi mo|ich auch / アニメ|anime|Anime / が|ga|(Partikel bei すき) / すき|suki|mögen / です|desu|(höflich) / 。',k:'私もアニメが好きです',de:'Ich mag Anime auch.',n:'も ersetzt は und heißt „auch“.'},

/* ---- sync between devices: whole state stored on Netlify under an 8-letter code ---- */
const API='/api/sync';
const mergeSrs=(a,b)=>{const o=Object.assign({},a);for(const id in b)if(!o[id]||(b[id].t||0)>(o[id].t||0))o[id]=b[id];return o};
console.assert(mergeSrs({x:{t:1},y:{t:5}},{x:{t:2},y:{t:3},z:{t:1}}).x.t===2&&mergeSrs({y:{t:5}},{y:{t:3}}).y.t===5,'merge self-check');
async function push(keepalive){
  if(!S.sync)return false;
  const {sync,...data}=S;
  try{return (await fetch(`${API}?code=${sync}`,{method:'PUT',body:JSON.stringify(data),keepalive:!!keepalive})).ok}catch(e){return false}
}
async function syncNow(code=S.sync){
  const r=await fetch(`${API}?code=${code}`);if(!r.ok)throw new Error(r.status);
  const R=await r.json();
  if(R===null&&code!==S.sync)return 'missing';
  if(R){S.srs=mergeSrs(S.srs,R.srs||{});if((R.updated||0)>(S.updated||0))S.kata=R.kata||S.kata}
  S.sync=code;S.updated=Date.now();writeLocal();
  return (await push())?'ok':'fail';
}

const DAYS=[0,1,2,4,8,16,32];
function next(box,ok){return ok?[Math.min(box+1,6),DAYS[Math.min(box+1,6)]*864e5]:[0,10*6e4]}

/* ---- helpers ---- */

const joinJP=t=>toks(t).map(x=>x.j).join('');
const joinRo=t=>toks(t).filter(x=>x.r).map(x=>x.r).join(' ');
function getItem(id){const [k,l,i]=id.split(':');const L=LESSONS[+l];return k==='w'?{kind:'w',w:L.words[+i]}:{kind:'s',s:L.sents[+i]}}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---- pronunciation check: compare recognizer text with kana and kanji spelling ---- */
const norm=s=>s.replace(/[\s、。！？!?,.…〜~「」]/g,'').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
function sim(a,b){
  a=norm(a);b=norm(b);if(!a||!b)return 0;
  let p=[...Array(b.length+1).keys()];
  for(let i=1;i<=a.length;i++){const c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}
  return 1-p[b.length]/Math.max(a.length,b.length);
}

/* ---- speech output ---- */
let voices=[];
const loadVoices=()=>{try{voices=speechSynthesis.getVoices()}catch(e){}};
const jaVoice=()=>voices.find(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith('ja'));
function speak(text){
  if(!('speechSynthesis' in window))return null;
  if(!voices.length)loadVoices();
  // Chrome drops an utterance spoken right after cancel(), so only cancel when something is playing
  if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();
  speechSynthesis.resume();
  const u=new SpeechSynthesisUtterance(text.replace(/〜/g,''));u.lang='ja-JP';u.rate=.85;
  const v=jaVoice();if(v)u.voice=v;
  speechSynthesis.speak(u);return u;
}
function testSound(m){
  if(!('speechSynthesis' in window)){m.textContent='Dieser Browser kann hier gar nicht vorlesen. Öffne die Seite in Chrome.';return}
  loadVoices();
  const noJa='Auf deinem Gerät ist keine japanische Stimme installiert. Android: in den Einstellungen nach „Text-zu-Sprache“ suchen › Sprachdienste von Google › Zahnrad › Sprachdaten installieren › Japanisch. Windows: Einstellungen › Zeit und Sprache › Sprache › Japanisch hinzufügen (mit Sprachausgabe).';
  m.textContent='Teste …';
  let started=false;const u=speak('こんにちは、ニコさん');
  u.onstart=()=>{started=true;m.textContent=jaVoice()?'Die Ausgabe läuft. Hörst du nichts, prüf Lautstärke und Bluetooth.':noJa};
  u.onerror=e=>{started=true;m.textContent='Fehler „'+e.error+'“. '+(jaVoice()?'Öffne die Seite in Chrome und teste nochmal.':noJa)};
  setTimeout(()=>{if(!started)m.textContent=(jaVoice()?'':noJa+' ')+'Die Ausgabe startet hier nicht. Öffne die Datei in Chrome und teste nochmal.'},3000);
}

/* ---- speech input (Chrome's built-in recognition, needs internet) ---- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
function listen(btn){
  const out=btn.parentElement.nextElementSibling,targets=JSON.parse(btn.dataset.mic);
  if(!SR){out.textContent='Die Aussprache-Prüfung gibt es nur in Chrome.';return}
  if(rec){rec.abort();return}
  try{speechSynthesis.cancel()}catch(e){}
  rec=new SR();rec.lang='ja-JP';rec.maxAlternatives=5;rec.interimResults=false;
  btn.classList.add('on');btn.lastChild.textContent='Ich höre zu …';out.textContent='';out.className='heard';
  rec.onresult=e=>{
    let best=0,heard=e.results[0][0].transcript;
    for(const a of e.results[0]){const s=Math.max(...targets.map(t=>sim(a.transcript,t)));if(s>best){best=s;heard=a.transcript}}
    const p=Math.round(best*100);
    out.className='heard '+(p>=80?'ok-t':p>=55?'mid-t':'bad-t');
    out.innerHTML=`Erkannt: <span class="jp">${esc(heard)}</span> · ${p} %<br>${p>=80?'Sehr gut!':p>=55?'Fast. Hör nochmal genau hin und versuch es noch einmal.':'Das war noch weit weg. Hör es dir an und sprich langsam nach.'}`;
  };
  rec.onerror=e=>{out.className='heard bad-t';out.textContent=
    e.error==='not-allowed'||e.error==='service-not-allowed'?'Das Mikrofon ist blockiert. Tipp links in der Adressleiste auf das Symbol und erlaube das Mikrofon.':
    e.error==='no-speech'?'Ich habe nichts gehört. Tipp nochmal und sprich direkt los.':
    e.error==='network'?'Die Aussprache-Prüfung braucht Internet.':
    e.error==='aborted'?'':'Das hat nicht geklappt ('+e.error+').'};
  rec.onend=()=>{rec=null;btn.classList.remove('on');btn.lastChild.textContent='Sprechen'};
  try{rec.start()}catch(e){rec=null;out.textContent='Das Mikrofon lässt sich hier nicht starten. Öffne die Datei in Chrome.'}
}

    try{const r=await syncNow(code);if(r==='missing')return syncMsg('Diesen Code gibt es nicht. Prüf ihn bitte nochmal.');home();syncMsg(r==='ok'?'Verbunden. Dein Fortschritt ist abgeglichen.':OFFLINE)}catch(e){syncMsg(OFFLINE)}
  });
  on('#syncnow',async()=>{syncMsg('Gleiche ab …');try{const r=await syncNow();home();syncMsg(r==='ok'?'Abgeglichen.':OFFLINE)}catch(e){syncMsg(OFFLINE)}});
  on('#unsync',()=>{S.sync=null;writeLocal();home();syncMsg('Getrennt. Dein Fortschritt bleibt auf diesem Gerät.')});
  app.querySelector('#sound').onclick=()=>testSound(app.querySelector('#soundmsg'));
  app.querySelector('#romaji').onchange=e=>{S.romaji=e.target.checked;save()};
  app.querySelector('#reset').onclick=()=>{if(confirmReset){S={srs:{},kata:{},romaji:S.romaji};save();confirmReset=false}else confirmReset=true;home()};
}

/* ---- sessions ---- */
let session=null;
function mcItem(li,wi,dir){
  const L=LESSONS[li],w=L.words[wi];
  const opts=shuffle([w,...shuffle(L.words.filter(x=>x!==w)).slice(0,3)]);
  return{k:'mc',id:`w:${li}:${wi}`,w,dir,opts};
}
function startLesson(li){
  const L=LESSONS[li],q=[];
  for(let c=0;c<L.words.length;c+=4){
    const idx=[...L.words.keys()].slice(c,c+4);
    idx.forEach(i=>q.push({k:'intro',w:L.words[i]}));
    shuffle(idx.slice()).forEach(i=>q.push(mcItem(li,i,'jd')));
  }
  shuffle([...L.words.keys()]).forEach(i=>q.push(mcItem(li,i,'dj')));
  L.sents.forEach((s,i)=>q.push({k:'card',id:`s:${li}:${i}`,dir:'jd'}));
  run(L.title,q);
}
function startReview(){
  const due=shuffle(dueIds()).slice(0,20);
  const old=shuffle(Object.keys(S.srs).filter(id=>!due.includes(id))).slice(0,2);
  run('Wiederholung',[...due,...old].map(id=>({k:'card',id,dir:Math.random()<.5?'jd':'dj',old:old.includes(id)})));
}
function startKata(){
  const weighted=KATA.flatMap(k=>Array(1+(S.kata[k[0]]||0)*2).fill(k));
  const pick=[];shuffle(weighted).forEach(k=>{if(pick.length<15&&!pick.includes(k))pick.push(k)});
  run('Katakana',pick.map(k=>({k:'kata',c:k,opts:shuffle([k,...shuffle(KATA.filter(x=>x!==k)).slice(0,3)])})));
}
function run(title,queue){session={title,queue,pos:0,results:{},first:0,firstOk:0};step()}
function record(id,ok){
  if(!(id in session.results)){session.first++;if(ok)session.firstOk++}
  session.results[id]=(session.results[id]??true)&&ok;
}
function finish(){if(!session)return;for(const id in session.results)grade(id,session.results[id]);save()}
function step(){
  if(rec)rec.abort();
  const s=session,it=s.queue[s.pos];
  if(!it)return done();
  app.innerHTML=`<div class="top"><button class="x" id="quit" aria-label="Beenden">×</button>
    <div class="grow"><div class="eyebrow">${esc(s.title)} · ${s.pos+1} / ${s.queue.length}</div><div class="bar"><i style="width:${s.pos/s.queue.length*100}%"></i></div></div></div>
    <section class="stage"><div class="inner" id="stage"></div></section>
    <div class="actions" id="actions"></div>`;
  app.querySelector('#quit').onclick=()=>{finish();home()};
  ({intro,mc,card,kata})[it.k](app.querySelector('#stage'),app.querySelector('#actions'),it);
}
function nextBtn(act){
  act.innerHTML='<button class="btn" id="next">Weiter</button>';
  const b=act.querySelector('#next');b.onclick=()=>{session.pos++;step()};b.focus();
}
const requeue=it=>session.queue.push(Object.assign({},it,{again:true}));

function intro(st,act,it){
  const w=it.w;
  st.innerHTML=`<div class="eyebrow">Neues Wort</div><p class="big jp">${w.j}</p>${w.k?`<div class="kanji jp">${w.k}</div>`:''}
    <div class="ro">${w.r}</div><div class="de">${esc(w.d)}</div>${controls(w.j,wordTargets(w))}${wordDetails(w)}`;
  speak(w.j);nextBtn(act);
}
function mc(st,act,it){
  const w=it.w,jd=it.dir==='jd';
  st.innerHTML=`<div class="eyebrow">${jd?'Was heißt das?':'Wie sagt man das auf Japanisch?'}</div>
    ${jd?`<p class="big jp">${w.j}</p>${S.romaji?`<div class="ro">${w.r}</div>`:''}${listenBtn(w.j)}`:`<p class="big" style="font-size:1.8rem">${esc(w.d)}</p>`}
    <div class="opts">${it.opts.map((o,i)=>`<button class="opt ${jd?'':'jp'}" data-i="${i}">${esc(jd?o.d:o.j)}</button>`).join('')}</div>
    <div class="fb" aria-live="polite"></div>`;
  act.innerHTML='<span class="hint">Wähle eine Antwort</span>';
  if(jd)speak(w.j);
  st.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const ok=it.opts[+b.dataset.i]===w;
    st.querySelectorAll('.opt').forEach((x,i)=>{x.disabled=true;if(it.opts[i]===w)x.classList.add('ok')});
    if(!ok){b.classList.add('bad');requeue(it)}
    record(it.id,ok);
    const fb=st.querySelector('.fb');fb.className='fb '+(ok?'ok-t':'bad-t');
    fb.textContent=ok?'Richtig!':`${w.j} (${w.r}) heißt „${w.d}“. Kommt gleich nochmal.`;
    if(!jd)speak(w.j);
    nextBtn(act);
  });
}
function card(st,act,it){
  const x=getItem(it.id),jd=it.dir==='jd',isW=x.kind==='w';
  const jp=isW?x.w.j:joinJP(x.s.t), de=isW?x.w.d:x.s.de;
  const targets=isW?wordTargets(x.w):[jp,x.s.k];
  const label=it.old?'Alter Bekannter':it.again?'Nochmal':isW?'Wort':'Satz';
  const front=()=>{
    st.innerHTML=`<div class="eyebrow">${label}</div>
      ${jd?(isW?`<p class="big jp">${jp}</p>${S.romaji?`<div class="ro">${x.w.r}</div>`:''}`:sentHTML(x.s.t,S.romaji))+controls(jp,targets)
          :`<p class="big" style="font-size:1.7rem">${esc(de)}</p>${targets?`<div class="row center"><button class="listen" data-mic="${esc(JSON.stringify(targets))}">${ICON_MIC}<span>Sprechen</span></button></div><div class="heard" aria-live="polite"></div>`:''}`}
      <p class="hint">${jd?'Hör zu, sprich nach und überleg, was es heißt.':'Sag es laut auf Japanisch, dann deck auf.'}</p>`;
    if(jd)speak(jp);
    act.innerHTML='<button class="btn" id="flip">Aufdecken</button>';
    act.querySelector('#flip').onclick=back;
  };
  const back=()=>{
    st.innerHTML=`<div class="eyebrow">${label}</div>
      ${isW?`<p class="big jp">${jp}</p>${x.w.k?`<div class="kanji jp">${x.w.k}</div>`:''}<div class="ro">${x.w.r}</div>`:sentHTML(x.s.t,true)}
      <div class="de">${esc(de)}</div>${controls(jp,targets)}
      ${isW?wordDetails(x.w):x.s.n?`<p class="note">${esc(x.s.n)}</p>`:''}`;
    speak(jp);
    act.innerHTML='<button class="btn ghost" id="no">Noch nicht</button><button class="btn" id="yes">Gewusst</button>';
    act.querySelector('#yes').onclick=()=>{record(it.id,true);session.pos++;step()};
    act.querySelector('#no').onclick=()=>{record(it.id,false);if(!it.again)requeue(it);session.pos++;step()};
    act.querySelector('#yes').focus();
  };
  front();
}
function kata(st,act,it){
  const [c,r]=it.c;
  st.innerHTML=`<div class="eyebrow">Welche Silbe ist das?</div><p class="kana jp">${c}</p>
    <div class="opts">${it.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o[1]}</button>`).join('')}</div>
    <div class="fb" aria-live="polite"></div>`;
  act.innerHTML='<span class="hint">Wähle eine Antwort</span>';
  st.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const ok=it.opts[+b.dataset.i]===it.c;
    st.querySelectorAll('.opt').forEach((x,i)=>{x.disabled=true;if(it.opts[i]===it.c)x.classList.add('ok')});
    if(!ok){b.classList.add('bad');requeue(it);S.kata[c]=(S.kata[c]||0)+1}else if(!it.again)S.kata[c]=Math.max(0,(S.kata[c]||0)-1);
    if(!it.again){session.first++;if(ok)session.firstOk++}
    save();speak(c);
    const fb=st.querySelector('.fb');fb.className='fb '+(ok?'ok-t':'bad-t');fb.textContent=ok?'Richtig!':`${c} ist „${r}“.`;
    nextBtn(act);
  });
}
function done(){
  const s=session;finish();session=null;
  app.innerHTML=`<div class="top"></div><section class="stage"><div class="inner"><div class="eyebrow">${esc(s.title)} geschafft</div>
    <p class="big jp">おつかれさま！</p><p class="de">${s.firstOk} von ${s.first} beim ersten Versuch richtig</p>
    <p class="hint">Was du nicht wusstest, kommt in 10 Minuten wieder. Der Rest kommt in ein paar Tagen.</p></div></section>
    <div class="actions"><button class="btn" id="home">Zur Übersicht</button></div>`;
  app.querySelector('#home').onclick=home;
}

/* ---- falling petals ---- */
(()=>{
  const cv=document.getElementById('petals'),ctx=cv.getContext('2d');
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  let W,H,col='#F4C3CF',t=0;const P=[];
  const size=()=>{W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px'};
  size();addEventListener('resize',size);
  for(let i=0;i<14;i++)P.push({x:Math.random(),y:Math.random(),s:.6+Math.random()*.8,v:.0005+Math.random()*.0007,r:Math.random()*6,w:Math.random()*6});
  (function f(){
    if(t++%60===0)col=getComputedStyle(document.documentElement).getPropertyValue('--sakura-deep').trim()||col;
    ctx.clearRect(0,0,W,H);ctx.fillStyle=col;ctx.globalAlpha=.3;
    const k=devicePixelRatio*7;
    for(const p of P){
      p.y+=p.v;p.x+=Math.sin((p.y*10)+p.w)*.0006;p.r+=.01;
      if(p.y>1.05){p.y=-.05;p.x=Math.random()}
      ctx.save();ctx.translate(p.x*W,p.y*H);ctx.rotate(p.r);ctx.scale(p.s,p.s*Math.abs(Math.cos(p.r))+.3);
      ctx.beginPath();ctx.moveTo(0,-k);ctx.bezierCurveTo(k,-k,k,k*.6,0,k);ctx.bezierCurveTo(-k,k*.6,-k,-k,0,-k);ctx.fill();ctx.restore();
    }
    requestAnimationFrame(f);
  })();
})();
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
home();
if(S.sync)syncNow().then(()=>{if(!session)home()}).catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.sync){clearTimeout(pushT);push(true)}});
</script>
